{{- if .Values.gateway.enabled -}}
# Same name and secret as the certificate the old Ingress created, so no new Let's Encrypt order was
# needed; renewals stay DNS-01 through GoDaddy.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.gateway.tlsSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.gateway.tlsSecret }}
  dnsNames:
    - {{ include "app.fqdn" . | quote }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .Values.gateway.clusterIssuer }}
{{- end }}
