{{- if .Values.gateway.enabled -}}
# Same name and secret as the certificate the Ingress used to create, so the switch needs no new
# Let's Encrypt order; renewals stay DNS-01 through GoDaddy.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.tls.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.ingress.tls.secretName }}
  dnsNames:
    - {{ include "app.fqdn" . | quote }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .Values.gateway.clusterIssuer }}
{{- end }}
