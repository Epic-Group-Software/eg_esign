{{- if .Values.gateway.enabled -}}
{{- $fullName := include "app.fullname" . -}}
# Same paths as the Ingress. Envoy picks the longest matching prefix, so rule order does not matter.
# nginx had proxy-read/send-timeout 300 and buffering off; Envoy streams by default.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ include "app.fqdn" . | quote }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ $fullName }}
      sectionName: {{ include "app.listenerName" . }}
  rules:
    {{- if .Values.mailpit.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /mailpit
      backendRefs:
        - name: {{ $fullName }}-mailpit
          port: {{ .Values.service.mailpit.httpPort }}
      timeouts:
        request: {{ .Values.gateway.requestTimeout }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.app.port }}
      timeouts:
        request: {{ .Values.gateway.requestTimeout }}
{{- end }}
