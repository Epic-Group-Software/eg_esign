apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEXTAUTH_SECRET: {{ .Values.secrets.nextauthSecret | quote }}
  NEXT_PRIVATE_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: {{ .Values.secrets.encryptionSecondaryKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.auth.rootPassword | quote }}
  # MinIO is the S3 endpoint, so its root password doubles as the S3 secret key.
  NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY: {{ .Values.minio.auth.rootPassword | quote }}
  NEXT_PRIVATE_SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  NEXT_PRIVATE_SIGNING_PASSPHRASE: {{ .Values.secrets.signingPassphrase | quote }}
  NEXT_PRIVATE_OIDC_CLIENT_ID: {{ .Values.secrets.oidcClientId | quote }}
  NEXT_PRIVATE_OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  NEXT_PRIVATE_DATABASE_URL: {{ include "app.databaseUrl" . | quote }}
  NEXT_PRIVATE_DIRECT_DATABASE_URL: {{ include "app.databaseUrl" . | quote }}
---
{{- if .Values.certificate.p12Base64 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}-certificate
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
data:
  cert.p12: {{ .Values.certificate.p12Base64 }}
{{- end }}
