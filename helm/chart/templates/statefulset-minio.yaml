apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "app.fullname" . }}-minio
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.componentLabels" (dict "component" "minio" "context" .) | nindent 4 }}
spec:
  serviceName: {{ include "app.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      {{- include "app.componentSelectorLabels" (dict "component" "minio" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.componentSelectorLabels" (dict "component" "minio" "context" .) | nindent 8 }}
    spec:
      # Chainguard's image defaults to uid 65532, but the existing data is owned by
      # root (the old minio/minio image ran as root). Group access via fsGroup is
      # not enough: MinIO fails with "Unable to write to the backend" unless it
      # owns the files. Running as root keeps the data untouched.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: minio
          image: "{{ .Values.image.minio.repository }}:{{ .Values.image.minio.tag }}"
          args:
            - server
            - /data
            - --console-address
            - ":{{ .Values.service.minio.consolePort }}"
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.auth.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.fullname" . }}-secret
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: api
              containerPort: {{ .Values.service.minio.apiPort }}
            - name: console
              containerPort: {{ .Values.service.minio.consolePort }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.minio.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}-minio
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.componentLabels" (dict "component" "minio" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.service.minio.type }}
  selector:
    {{- include "app.componentSelectorLabels" (dict "component" "minio" "context" .) | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.service.minio.apiPort }}
      targetPort: api
    - name: console
      port: {{ .Values.service.minio.consolePort }}
      targetPort: console
