# Gitleaks config for eg-esign CI (jenkins/security-scan.groovy).
#
# Extends the upstream default ruleset and only adds path exclusions. The scan
# runs with --no-git against the working tree, so it must skip directories that
# are not source: dependency trees, build output, and the checked-in test
# fixtures that upstream Documenso ships (a deliberately-public example signing
# certificate and .env.example placeholders).

[extend]
useDefault = true

[allowlist]
description = "Non-source paths and known-public upstream test fixtures"
# NOTE: gitleaks matches these against the path it was given, which is absolute
# (/repo/...) when scanning a mounted directory. Do not anchor with ^.
paths = [
    # Dependency and build output — absent from a clean checkout, but the CI
    # workspace is reused across builds.
    '''(^|/)node_modules/''',
    '''(^|/)\.git/''',
    '''(^|/)dist/''',
    '''(^|/)\.next/''',
    '''(^|/)\.turbo/''',
    '''(^|/)generated/''',
    '''package-lock\.json$''',

    # Upstream Documenso fixtures and docs. apps/remix/example/cert.p12 is a
    # publicly-distributed self-signed cert used by the e2e suite; .env.example
    # holds placeholders ("CAFEBABE", "DEADBEEF"); the docs tree is full of
    # illustrative API keys and curl -H "Authorization: ..." snippets.
    '''(^|/)apps/remix/example/''',
    '''(^|/)apps/docs/content/''',
    '''(^|/)packages/app-tests/''',
    '''(^|/)patches/''',
    '''\.env\.example$''',

    # This pipeline's own `curl -u "$GIT_USER:$GIT_PASS"` calls, which are
    # credential *references*, not credentials.
    '''(^|/)jenkins/.*\.groovy$''',
    '''(^|/)tools/upstream-sync/''',
]
