apiVersion: v1
kind: ConfigMap
metadata:
  name: eg-esign-config
data:
  NEXT_PUBLIC_WEBAPP_URL: "https://esign-staging.epicgroup.ca"

  # Mail goes to the in-cluster mailpit sink, never SendGrid — staging must not
  # be able to email real signers. See mailpit.yaml.
  NEXT_PRIVATE_SMTP_HOST: "mailpit"
  NEXT_PRIVATE_SMTP_PORT: "1025"
  NEXT_PRIVATE_SMTP_SECURE: "false"
  NEXT_PRIVATE_SMTP_USERNAME: "staging"
  NEXT_PRIVATE_SMTP_FROM_NAME: "Epic Group e-Sign (staging)"
  NEXT_PRIVATE_SMTP_FROM_ADDRESS: "noreply-staging@epicgroup.ca"
