apiVersion: apps/v1
kind: Deployment
metadata:
  name: eg-esign
  labels:
    app: eg-esign
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: eg-esign
  template:
    metadata:
      labels:
        app: eg-esign
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30

      # Init container to create MinIO bucket
      initContainers:
        - name: create-bucket
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for MinIO to be ready..."
              for i in $(seq 1 60); do
                echo "Attempt $i: Connecting to http://minio:9000..."
                if mc alias set myminio http://minio:9000 eg-esign "$MINIO_ROOT_PASSWORD"; then
                  echo "MinIO ready! Creating bucket..."
                  mc mb myminio/eg-esign --ignore-existing
                  echo "Bucket ready!"
                  exit 0
                fi
                echo "MinIO not ready, retrying in 5s..."
                sleep 5
              done
              echo "Failed to connect to MinIO after 60 attempts"
              exit 1
          env:
            - name: MC_CONFIG_DIR
              value: "/tmp/.mc"
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eg-esign-secrets
                  key: MINIO_ROOT_PASSWORD

        # Init container to run database migrations
        - name: migrate
          image: epicregistry.azurecr.io/davinci-technology/eg-esign
          command:
            - npx
            - prisma
            - migrate
            - deploy
            - --schema
            - /app/packages/prisma/schema.prisma
          envFrom:
            - configMapRef:
                name: eg-esign-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eg-esign-secrets
                  key: POSTGRES_PASSWORD
            - name: NEXT_PRIVATE_DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)?sslmode=$(DB_SSLMODE)"
            - name: NEXT_PRIVATE_DIRECT_DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)?sslmode=$(DB_SSLMODE)"

      containers:
        - name: app
          image: epicregistry.azurecr.io/davinci-technology/eg-esign
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http

          envFrom:
            - configMapRef:
                name: eg-esign-config

          env:
            # Database URL constructed from parts
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eg-esign-secrets
                  key: POSTGRES_PASSWORD
            - name: NEXT_PRIVATE_DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)?sslmode=$(DB_SSLMODE)"
            - name: NEXT_PRIVATE_DIRECT_DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)?sslmode=$(DB_SSLMODE)"

            # Secrets from eg-esign-secrets
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: eg-esign-secrets
                  key: NEXTAUTH_SECRET
            - name: NEXT_PRIVATE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: eg-esign-secrets
                  key: NEXT_PRIVATE_ENCRYPTION_KEY
            - name: NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY
              valueFrom:
                secretKeyRef:
                  name: eg-esign-secrets
                  key: NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY
            - name: NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: eg-esign-secrets
                  key: NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY
            - name: NEXT_PRIVATE_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eg-esign-secrets
                  key: NEXT_PRIVATE_SMTP_PASSWORD
            - name: NEXT_PRIVATE_SIGNING_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: eg-esign-secrets
                  key: NEXT_PRIVATE_SIGNING_PASSPHRASE
            - name: NEXT_PRIVATE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: eg-esign-secrets
                  key: NEXT_PRIVATE_OIDC_CLIENT_ID
            - name: NEXT_PRIVATE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eg-esign-secrets
                  key: NEXT_PRIVATE_OIDC_CLIENT_SECRET

          volumeMounts:
            - name: certificate
              mountPath: /opt/eg-esign
              readOnly: true

          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "2Gi"
              cpu: "1500m"

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false

      volumes:
        - name: certificate
          secret:
            secretName: eg-esign-certificate
            items:
              - key: cert.p12
                path: cert.p12
            defaultMode: 0400

      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1000

      imagePullSecrets:
        - name: acr-pull-secret
---
apiVersion: v1
kind: Service
metadata:
  name: eg-esign
  labels:
    app: eg-esign
spec:
  selector:
    app: eg-esign
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
